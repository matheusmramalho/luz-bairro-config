apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# TODO(aluno): troque cicd-dev pelo seu projeto de desenvolvimento ($DEV_NS) aqui e em "newName".
namespace: cicd-dev-matheusmr

resources:
  - ../../base

# As linhas "newName", "digest" e "APP_VERSION" sao reescritas pelo pipeline (task update-config).
# Nao altere o formato delas: o pipeline as localiza por padrao de texto.
images:
  - name: luz-bairro
    newName: image-registry.openshift-image-registry.svc:5000/cicd-dev-matheusmr/luz-bairro
    digest: sha256:47bd0ff082286cbe4929e9e12ec41912e4bf2dfb3599df0413874fc25a40aa41

configMapGenerator:
  - name: luz-bairro-config
    behavior: merge
    literals:
      - APP_ENV=dev
      - APP_VERSION=868acda
