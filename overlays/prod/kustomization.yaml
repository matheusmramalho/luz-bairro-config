apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# TODO(aluno): troque cicd-prod pelo seu projeto de producao ($PROD_NS).
namespace: cicd-prod-matheusmr

resources:
  - ../../base

# Producao NAO e construida: usa a MESMA imagem de dev, identificada pelo digest.
# O digest (e APP_VERSION) so mudam por pull request de promocao (config/scripts/promover.sh).
# TODO(aluno): em newName, troque cicd-dev pelo seu projeto de DESENVOLVIMENTO ($DEV_NS),
# porque e la que o pipeline publica a imagem.
images:
  - name: luz-bairro
    newName: image-registry.openshift-image-registry.svc:5000/cicd-dev-matheusmr/luz-bairro
    digest: sha256:8ade45064a2b269f5d7b7aadf041a75eab0f397a7174e214c9fc5112d9e79993

configMapGenerator:
  - name: luz-bairro-config
    behavior: merge
    literals:
      - APP_MESSAGE=Portal Luz do Bairro - PRODUCAO
      - APP_ENV=prod
      - APP_VERSION=012f0b5

patches:
  - target:
      kind: Deployment
      name: luz-bairro
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
